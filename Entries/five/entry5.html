<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style5.css">
  <link rel="icon" href="../landing/landimg/globe.png" type="image/png">
  <title>EMILYTRAVEL</title>
</head>
<body>
  <main class="hero">
    <header class="hero__header">
      <h1 class="hero__title"><a href="../landing/landing.html">EMILY THE EXPLORER</a></h1>
      <p class="hero__summary">As time passes, Emily travels through more countries. She experiences different cultures, cuisines, adventures. She would much rather travel instead of sitting at her bamboo desk from facebook marketplace, and spending her whole afternoon on adobe. Click on Emily</p>
    </header>

    <section class="hero__map">
      <div class="map-wrapper">
        <img src="fiveimg/world.png" alt="Stylized world map" class="background-image">

        <div class="world">
          <a href="asia.html" class="pin pin--asia" aria-label="See Emily's stories from Asia">
            <img src="fiveimg/did.png" alt="Asia marker">
          </a>

          <a href="europe.html" class="pin pin--europe" aria-label="See Emily's stories from Europe">
            <img src="fiveimg/did.png" alt="Europe marker">
          </a>

          <a href="america.html" class="pin pin--america" aria-label="See Emily's stories from America">
            <img src="fiveimg/did.png" alt="America marker">
          </a>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const vectors = [
        { x: "-120vw", y: "-20vh" },
        { x: "-95vw", y: "45vh" },
        { x: "110vw", y: "-35vh" },
        { x: "85vw", y: "65vh" },
        { x: "-40vw", y: "-85vh" },
        { x: "25vw", y: "90vh" },
        { x: "-110vw", y: "15vh" },
        { x: "10vw", y: "-95vh" }
      ];

      const pins = document.querySelectorAll(".pin");
      pins.forEach((pin, index) => {
        const choice =
          vectors.splice(Math.floor(Math.random() * vectors.length), 1)[0] ||
          { x: "0", y: "-80vh" };

        const delay = (Math.random() * 0.4 + index * 0.05).toFixed(2);
        const duration = (Math.random() * 0.25 + 0.45).toFixed(2);

        pin.style.setProperty("--pin-enter-x", choice.x);
        pin.style.setProperty("--pin-enter-y", choice.y);
        pin.style.setProperty("--pin-delay", `${delay}s`);
        pin.style.setProperty("--pin-in-duration", `${duration}s`);
      });
    })();
  </script>
</body>
</html>
